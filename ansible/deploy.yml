---
- name: Configure MongoDB on Private EC2
  hosts: database
  become: yes

  tasks:
    - name: Ensure MongoDB service is enabled and running
      service:
        name: mongod
        state: started
        enabled: yes

    - name: Verify MongoDB is listening on port 27017
      wait_for:
        port: 27017
        host: 10.0.2.43
        timeout: 30

- name: Deploy TravelMemory application
  hosts: web
  become: yes

  tasks:
    - name: Ensure Nginx is running
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Install backend dependencies
      npm:
        path: /home/ubuntu/TravelMemory/backend
        state: present
      become_user: ubuntu

    - name: Build React frontend
      command: npm run build
      args:
        chdir: /home/ubuntu/TravelMemory/frontend
      become_user: ubuntu

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
